<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regreso al futuro</title>
  <link rel="stylesheet" type="text/css" href="Reto06_RegresoAlFuturo.css">
  <script src="Reto06_RegresoAlFuturo.js"></script>
</head>
<body>
  <div class="centro">
    <p class="etiqueta">PRESENT TIME</p>
    <p class="data-lerroa">
      <input type="text" value="OCT" size="3" maxlength="3" class="verde" id="presenteMes" aria-label="Present time month">
      <input type="number" value="26" size="2" min="1" max="31" class="verde" id="presenteDia" aria-label="Present time day">
      <input type="number" value="1985" size="4" min="0" max="9999" class="verde" id="presenteAno" aria-label="Present time year">
      <input type="number" value="01" size="2" min="0" max="23" class="verde" id="presenteHora" aria-label="Present time hour">
      <input type="number" value="21" size="2" min="0" max="59" class="verde" id="presenteMinuto" aria-label="Present time minute">
    </p>

    <p class="etiqueta">DESTINATION TIME</p>
    <p class="data-lerroa">
      <input type="text" value="JUN" size="3" maxlength="3" class="rojo" id="destinoMes" aria-label="Destination month">
      <input type="number" value="1" size="2" min="1" max="31" class="rojo" id="destinoDia" aria-label="Destination day">
      <input type="number" value="2020" size="4" min="0" max="9999" class="rojo" id="destinoAno" aria-label="Destination year">
      <input type="number" value="17" size="2" min="0" max="23" class="rojo" id="destinoHora" aria-label="Destination hour">
      <input type="number" value="00" size="2" min="0" max="59" class="rojo" id="destinoMinuto" aria-label="Destination minute">
    </p>

    <button type="button" id="calcular">Kalkulatu bidaia</button>
    <p id="mensaje" role="status" aria-live="polite"></p>
  </div>
</body>
</html>
